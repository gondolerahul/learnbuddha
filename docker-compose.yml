services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: learnbuddha
      POSTGRES_PASSWORD: learnbuddha
      POSTGRES_DB: learnbuddha
    ports:
      - "5433:5432"
    volumes:
      - lb_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnbuddha"]
      interval: 3s
      retries: 20
volumes:
  lb_pg:
